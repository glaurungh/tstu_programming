# Basic server settings
host = localhost
port = 8080
debug = true
timeout = 30.5

# Boolean variants
feature_x_enabled = yes
feature_y_enabled = no
logging_enabled = on
metrics_enabled = off

# Integer and float values
max_connections = 150
min_connections = 0
pi_approx = 3.14159
negative_int = -42
negative_float = -0.75

# Lists (mixed types)
allowed_ips = 192.168.1.1, 10.0.0.1, 127.0.0.1
retry_delays = 1, 5, 10, 30
feature_flags = alpha, beta, gamma
mixed_list = 1, 2.5, true, no, text

# Strings that look like numbers/bools
env = production
version = v1.0.0
bool_like_string = TRUE!
number_like_string = 00123x

# Edge cases with spaces
trim_test =   value with spaces
list_with_spaces =  a ,  b ,   c

# Empty and weird lines
# next line is intentionally invalid for parser error test
invalid_line_without_equal